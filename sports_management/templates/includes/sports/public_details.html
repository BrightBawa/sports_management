{% if public_details %}
<section class="sports-public-details" aria-labelledby="public-details-title">
  <h2 id="public-details-title">{{ _("Profile details") }}</h2>
  <dl class="sports-public-facts">
    {% for detail in public_details %}
    <div>
      <dt>{{ detail.label |e }}</dt>
      <dd>{% if detail.route %}<a href="/{{ detail.route |e }}">{{ detail.value |e }}</a>{% else %}{{ detail.value |e }}{% endif %}</dd>
    </div>
    {% endfor %}
  </dl>
</section>
{% endif %}
