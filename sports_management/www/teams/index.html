{% extends "templates/sports_web.html" %}

{% block page_content %}
{% include "templates/includes/sports/styles.html" %}
<section class="sports-site">
  <div class="sports-hero">
    <h1>Teams</h1>
  </div>
  <div class="sports-grid">
    {% for team in teams %}
    <article class="sports-card">
      <h3><a href="/{{ team.route }}">{{ team.team_name }}</a></h3>
      <p class="sports-meta">{{ team.sport }}{% if team.season %} · {{ team.season }}{% endif %}</p>
    </article>
    {% endfor %}
  </div>
</section>
{% endblock %}
